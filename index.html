<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Javier Alfonso Moreno | Marketing Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;700;900&family=Barlow:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:       #050508;
      --surface:  #0c0c12;
      --border:   #1a1a26;
      --accent:   #00a3ff;
      --text:     #ffffff;
      --muted:    #c3c9d4;
      --faint:    #2a2a36;

      --font-display: 'Barlow Condensed', sans-serif;
      --font-body:    'Barlow', sans-serif;
      --font-mono:    'DM Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      cursor: none;
    }

    /* ───────────────────────────────
       CUSTOM CURSOR
    ─────────────────────────────── */
    .cursor {
      position: fixed;
      top: 0; left: 0;
      width: 12px; height: 12px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transition: transform 0.12s ease, opacity 0.2s;
      mix-blend-mode: difference;
    }
    .cursor-ring {
      position: fixed;
      top: 0; left: 0;
      width: 40px; height: 40px;
      border: 1px solid rgba(0,163,255,0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transition: transform 0.22s ease;
      mix-blend-mode: difference;
    }

    /* Noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 99px; }

    .page { max-width: 1200px; margin: 0 auto; padding: 0 28px 80px; position: relative; z-index: 1; }

    /* ───────────────────────────────
       HEADER
    ─────────────────────────────── */
    header {
      padding-top: 56px;
      padding-bottom: 40px;
      position: relative;
    }

    .header-eyebrow {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
      opacity: 0;
      animation: fadeUp 0.6s 0.1s forwards;
    }

    .hero-name {
      font-family: var(--font-display);
      font-size: clamp(72px, 12vw, 148px);
      font-weight: 900;
      line-height: 0.88;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      color: var(--text);
      opacity: 0;
      animation: fadeUp 0.7s 0.2s forwards;
    }

    .hero-name span { color: var(--accent); }

    .hero-rule {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, var(--accent) 0%, transparent 60%);
      margin: 20px 0 24px;
      opacity: 0;
      animation: fadeIn 0.6s 0.4s forwards;
    }

    /* ───────────────────────────────
       HERO PHOTO (PASO 1)
    ─────────────────────────────── */
    .hero-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 32px;
    }

    .hero-left {
      max-width: 60%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-photo {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-photo img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--accent);
      box-shadow: 0 8px 24px rgba(0,163,255,0.25);
      opacity: 0;
      animation: fadeUp 0.6s 0.3s forwards;
    }

    @media (max-width: 860px) {
      .hero-left { max-width: 100%; }
      .hero-photo img { width: 150px; height: 150px; }
    }
    @media (max-width: 520px) {
      .hero-photo img { width: 120px; height: 120px; }
    }

    .hero-role {
      font-family: var(--font-display);
      font-size: clamp(18px, 2.5vw, 26px);
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hero-tagline {
      font-size: 14px;
      color: var(--muted);
      max-width: 380px;
      line-height: 1.7;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .btn {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      padding: 10px 18px;
      border-radius: 2px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: none;
      transition: all 0.18s;
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 500;
    }
    .btn-primary:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0,163,255,0.25);
    }
    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }
