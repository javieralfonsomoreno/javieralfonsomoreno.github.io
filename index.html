<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Javier Alfonso Moreno | Marketing Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;700;900&family=Barlow:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ───────────────────────────────────────────────
       PREMIUM PALETTE — LUXURY TECH BLUE
    ─────────────────────────────────────────────── */
    :root {
      --bg:       #050508;
      --surface:  #0c0c12;
      --border:   #1a1a26;
      --accent:   #00a3ff;
      --text:     #ffffff;
      --muted:    #c3c9d4;
      --faint:    #2a2a36;

      --font-display: 'Barlow Condensed', sans-serif;
      --font-body:    'Barlow', sans-serif;
      --font-mono:    'DM Mono', monospace;
    }

    /* Reset */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      cursor: none;
    }

    /* ───────────────────────────────────────────────
       CUSTOM CURSOR
    ─────────────────────────────────────────────── */
    .cursor {
      position: fixed;
      top: 0; left: 0;
      width: 12px; height: 12px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transition: transform 0.12s ease, opacity 0.2s;
      mix-blend-mode: difference;
    }
    .cursor-ring {
      position: fixed;
      top: 0; left: 0;
      width: 40px; height: 40px;
      border: 1px solid rgba(0,163,255,0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transition: transform 0.22s ease;
      mix-blend-mode: difference;
    }

    /* Noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 99px; }

    /* Layout */
    .page { max-width: 1200px; margin: 0 auto; padding: 0 28px 80px; position: relative; z-index: 1; }

    /* ───────────────────────────────────────────────
       HEADER
    ─────────────────────────────────────────────── */
    header {
      padding-top: 56px;
      padding-bottom: 40px;
      position: relative;
    }

    .header-eyebrow {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
      opacity: 0;
      animation: fadeUp 0.6s 0.1s forwards;
    }

    .hero-name {
      font-family: var(--font-display);
      font-size: clamp(72px, 12vw, 148px);
      font-weight: 900;
      line-height: 0.88;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      color: var(--text);
      opacity: 0;
      animation: fadeUp 0.7s 0.2s forwards;
    }

    .hero-name span {
      color: var(--accent);
      display: inline-block;
      position: relative;
    }

    .hero-rule {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, var(--accent) 0%, transparent 60%);
      margin: 20px 0 24px;
      opacity: 0;
      animation: fadeIn 0.6s 0.4s forwards;
    }

    .hero-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
      opacity: 0;
      animation: fadeUp 0.6s 0.5s forwards;
    }

    .hero-role {
      font-family: var(--font-display);
      font-size: clamp(18px, 2.5vw, 26px);
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hero-tagline {
      font-size: 14px;
      color: var(--muted);
      max-width: 380px;
      text-align: right;
      line-height: 1.7;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      justify-content: flex-end;
    }

    /* Buttons */
    .btn {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      padding: 10px 18px;
      border-radius: 2px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: none;
      transition: all 0.18s;
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 500;
    }
    .btn-primary:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0,163,255,0.25);
    }
    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* ───────────────────────────────────────────────
       STATS BAR
    ─────────────────────────────────────────────── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 40px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.6s 0.7s forwards;
    }

    .stat-item {
      padding: 20px 22px;
      border-right: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      transition: background 0.2s;
    }
    .stat-item:last-child { border-right: none; }
    .stat-item:hover { background: var(--surface); }

    .stat-num {
      font-family: var(--font-display);
      font-size: clamp(28px, 3.5vw, 40px);
      font-weight: 900;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .stat-label {
      font-family: var(--font-mono);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--muted);
    }

    /* ───────────────────────────────────────────────
       MAIN GRID
    ─────────────────────────────────────────────── */
    main {
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr);
      gap: 28px;
    }

    /* Section headers */
    .section-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .section-tag {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(0,163,255,0.07);
      border: 1px solid rgba(0,163,255,0.18);
      padding: 3px 8px;
      border-radius: 2px;
    }
    .section-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text);
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 24px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--accent); }

    /* About */
    .about-text {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.85;
      margin-bottom: 16px;
    }
    .about-text strong { color: var(--text); font-weight: 500; }

    .pill-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .pill {
      font-family: var(--font-mono);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      padding: 5px 10px;
      border-radius: 2px;
      border: 1px solid var(--border);
      color: var(--muted);
      transition: all 0.15s;
    }
    .pill:hover { border-color: var(--accent); color: var(--accent); }
    .pill-hot {
      border-color: rgba(0,163,255,0.3);
      color: var(--accent);
      background: rgba(0,163,255,0.05);
    }

    /* Projects */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .project-card {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }
    .project-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 16px 40px rgba(0,163,255,0.15);
    }

    .project-tag {
      font-family: var(--font-mono);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .project-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      color: var(--text);
      line-height: 1.2;
    }
    .project-text {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 10px;
    }
    .project-metric {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 0.08em;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    /* Timeline */
    .timeline { position: relative; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 0;
      top: 6px; bottom: 0;
      width: 1px;
      background: linear-gradient(180deg, var(--accent) 0%, transparent 100%);
    }

    .timeline-item {
      padding-left: 22px;
      margin-bottom: 26px;
      position: relative;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -3px;
      top: 6px;
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
    }

    .timeline-date {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .timeline-role {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text);
      margin-bottom: 2px;
    }
    .timeline-company {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 0.12em;
      margin-bottom: 10px;
    }
    .timeline-bullets {
      list-style: none;
      display: grid;
      gap: 5px;
    }
    .timeline-bullets li {
      font-size: 12px;
      color: var(--muted);
      padding-left: 14px;
      position: relative;
      line-height: 1.6;
    }
    .timeline-bullets li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--accent);
      font-size: 10px;
    }
    .timeline-bullets li strong { color: var(--text); font-weight: 500; }

    /* Sidebar */
    .side-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .side-title {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .skill-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
    }
    .skill-row:last-child { border-bottom: none; }
    .skill-name { font-size: 11px; color: var(--text); }
    .skill-bar {
      width: 60px;
      height: 2px;
      background: var(--faint);
      border-radius: 99px;
      overflow: hidden;
    }
    .skill-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transform: scaleX(0);
      transform-origin: left;
      animation: fillBar 1s 1s forwards ease-out;
    }

    .lang-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .lang-item:last-child { border-bottom: none; }
    .lang-name { color: var(--text); }
    .lang-level {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color
